services:
  # Primary Database
  - type: pserv
    name: pisahub-postgres
    env: postgres
    plan: starter
    databaseName: pisahub
    user: pisahub

  # Redis Cache
  - type: redis
    name: pisahub-redis
    plan: free

  # Express Backend API
  - type: web
    name: pisahub-api
    env: docker
    dockerfilePath: apps/api/Dockerfile
    plan: starter
    disk:
      name: repos_data
      mountPath: /app/repos
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pisahub-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pisahub-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: API_URL
        value: https://pisahub-api.onrender.com
      - key: CLIENT_URL
        value: https://your-frontend-domain.netlify.app
      - key: NODE_ENV
        value: production
      - key: RATE_LIMIT_MAX
        value: "5000"
