name: CI Pipeline
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Node.js
        run: node --version || echo "Node not installed on runner"
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm install; else echo "No package.json"; fi
      - name: Run linter
        run: |
          if [ -f package.json ]; then npm run lint || echo "No lint script"; fi
      - name: Run tests
        run: |
          if [ -f package.json ]; then npm test || echo "No tests"; fi
      - name: Build
        run: |
          if [ -f package.json ]; then npm run build || echo "No build script"; fi
      - name: Success
        run: echo "CI pipeline completed successfully!"
