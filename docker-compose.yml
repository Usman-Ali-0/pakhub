
services:
  # ─────────────────────────────────────────
  # Express Backend API
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pakhub-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      API_URL: ${API_URL:-http://143.198.88.163:4000}
      CLIENT_URL: ${CLIENT_URL:-http://143.198.88.163:3000}
      CORS_ORIGINS: http://143.198.88.163:3000,http://localhost:3000,http://143.198.88.163,http://pakhub.net,https://pakhub.net
      DATABASE_URL: postgresql://pakhub:pakhub123@postgres:5432/pakhub
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-pakhub-jwt-secret-change-in-production-min-32-chars-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-pakhub-refresh-secret-change-in-production-min-32}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: pakhub_admin
      MINIO_SECRET_KEY: pakhub_secret_123
      MINIO_BUCKET: pakhub
    volumes:
      - repos_data:/app/repos
      - uploads_data:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: pakhub-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - api

  # ─────────────────────────────────────────
  # PostgreSQL — Primary Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pakhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pakhub
      POSTGRES_PASSWORD: pakhub123
      POSTGRES_DB: pakhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakhub -d pakhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis — Cache, Sessions, Job Queue
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pakhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # MinIO — Object Storage (S3-compatible)
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: pakhub-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: pakhub_admin
      MINIO_ROOT_PASSWORD: pakhub_secret_123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: pakhub-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  repos_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: pakhub-network
